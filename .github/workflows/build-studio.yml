name: Build Studio

on:
  push:
    paths:
      - "studio/**"
      - ".github/workflows/build-studio.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/build-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron_target: linux
            artifact_name: studio-linux
            artifact_glob: "*.AppImage"
          - os: windows-latest
            electron_target: win
            artifact_name: studio-windows
            artifact_glob: "*.exe"
          - os: macos-latest
            electron_target: mac
            artifact_name: studio-macos
            artifact_glob: "*.dmg"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build renderer
        working-directory: studio
        run: npm run build:renderer

      - name: Package app
        working-directory: studio
        run: npx electron-builder --${{ matrix.electron_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: studio/dist/${{ matrix.artifact_glob }}
          if-no-files-found: error
