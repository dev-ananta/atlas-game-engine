name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-studio-installers:
    name: Build Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron_target: linux
            artifact_name: studio-linux
            artifact_glob: "*.AppImage"
          - os: windows-latest
            electron_target: win
            artifact_name: studio-windows
            artifact_glob: "*.exe"
          - os: macos-latest
            electron_target: mac
            artifact_name: studio-macos
            artifact_glob: "*.dmg"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build renderer
        working-directory: studio
        run: npm run build:renderer

      - name: Package app
        working-directory: studio
        run: npx electron-builder --${{ matrix.electron_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: studio/dist/${{ matrix.artifact_glob }}
          if-no-files-found: error

  build-runtime-and-game:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build example package
        run: |
          npm ci --prefix build-tools
          node build-tools/src/validate-manifest.js examples/hello-world/scene.manifest
          node build-tools/src/bundle-assets.js examples/hello-world/assets examples/hello-world/build/assets.bundle
          node build-tools/src/compile-lua.js examples/hello-world/scripts examples/hello-world/build/scripts.bundle
          node build-tools/src/package-game.js examples/hello-world/scene.manifest examples/hello-world/build hello-world.game

      - name: Build runtime
        run: |
          cmake -S runtime -B runtime/build -DCMAKE_BUILD_TYPE=Release
          cmake --build runtime/build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: hello-world-game
          path: examples/hello-world/build/hello-world.game
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-linux
          path: runtime/build/bin/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-studio-installers
      - build-runtime-and-game

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*
